global:
  scrape_interval: 15s         # How often to scrape targets
  evaluation_interval: 15s     # How often to evaluate rules

rule_files:
  - "/etc/prometheus/rules/*.yml"  # Load alerting/recording rules

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'avd'
    static_configs:
      - targets:
          - vma1insrvneur:9182
          - vm2winsrvneur:9182
          - vm3winsrvneur:9182
          - vm4winsrvneur:9182
          - vm5winsrvneur:9182

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):9182'
        replacement: '${1}'
  

  

# Optional: Alertmanager (add service later)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
