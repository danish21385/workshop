global:
  scrape_interval: 15s         # How often to scrape targets
  evaluation_interval: 15s     # How often to evaluate rules

rule_files:
  - "/etc/prometheus/rules/*.yml"  # Load alerting/recording rules

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'avd'
    static_configs:
      - targets:
          - vmadrwinsrvneur:9182
          - vmaipwinsrvneur:9182
          - vmaqlwinsrvneur:9182
          - vmaviwinsrvneur:9182
          - vmblgwinsrvneur:9182
          - vmdeuwinsrvneur:9182
          - vmdnywinsrvneur:9182
          - vmfpgwinsrvneur:9182
          - vmhrawinsrvneur:9182
          - vmjlpswinsrvneur:9182
          - vmkaywinsrvneur:9182
          - vmlsrwinsrvneur:9182
          - vmprswinsrvneur:9182
          - vmskwwinsrvneur:9182
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):9182'
        replacement: '${1}'
  

  

# Optional: Alertmanager (add service later)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
