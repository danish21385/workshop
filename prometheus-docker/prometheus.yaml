global:
  scrape_interval: 15s         # How often to scrape targets
  evaluation_interval: 15s     # How often to evaluate rules

rule_files:
  - "/etc/prometheus/rules/*.yml"  # Load alerting/recording rules

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'host_node'
    static_configs:
      - targets: ['192.168.111.129:9100']
  
  # Scrape your Linux host metrics (install node_exporter first)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['localhost:9100']
  

# Optional: Alertmanager (add service later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']
