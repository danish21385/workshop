apiVersion: v1
kind: Pod
metadata:
  name: hey-load
spec:
  containers:
  - name: hey
    image: williamyeh/hey:latest
    args: ["-c", "50", "-z", "1h", "http://nginx-deployment.default.svc.cluster.local"]
  restartPolicy: Never
